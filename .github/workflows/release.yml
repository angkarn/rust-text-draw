name: Release

# Creates a tag and GitHub release for the version in Cargo.toml.
# Run manually: Actions > Release > Run workflow (needs a "## <version>" section in CHANGELOG.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          crate_version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$crate_version" != "$VERSION" ]; then
            echo "Cargo.toml version ($crate_version) does not match $VERSION"; exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Extract release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No '## $VERSION' section in CHANGELOG.md"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "textplate $VERSION" \
            --notes-file notes.md
